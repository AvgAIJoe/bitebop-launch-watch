<script>
(function(){
  var D=JSON.parse(document.getElementById('d').textContent), f=document.getElementById('g'), e=document.getElementById('e');
  var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  async function open(pp){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pp),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.salt),iterations:D.rounds,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},key,b(D.ct));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem('bb-watch-pp',pp)}catch(_){}
    document.open();document.write(html);document.close();
  }
  f.addEventListener('submit',async function(ev){ev.preventDefault();e.textContent='';try{await open(document.getElementById('pp').value)}catch(_){e.textContent='That passphrase did not work.'}});
  try{var s=sessionStorage.getItem('bb-watch-pp'); if(s){open(s).catch(function(){})}}catch(_){}
})();
</script></body></html>
